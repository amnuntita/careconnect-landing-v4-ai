name: AEO tracker

on:
  schedule:
    # 02:00 UTC = 09:00 Asia/Bangkok on the 1st of every month.
    - cron: "0 2 1 * *"
  workflow_dispatch:

# Least privilege: the only thing this workflow needs is to commit the results folder.
permissions:
  contents: write

concurrency:
  group: aeo-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Ask the AI engines
        env:
          PYTHONPATH: src
          # Keys are passed only to this step. Missing secrets arrive as empty
          # strings and that engine is skipped. The code never prints them.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m aeo

      - name: Show summary on the run page
        run: |
          latest="$(find results -mindepth 2 -maxdepth 2 -name summary.md | sort | tail -n 1)"
          if [ -n "$latest" ]; then cat "$latest" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No new results to commit."
            exit 0
          fi
          git commit -m "AEO tracker results $(TZ=Asia/Bangkok date +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
